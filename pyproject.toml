[project]
name = "stranded-guest-support"
version = "0.1.0"
description = "Ticket sorting and AirCover policy rules for the Lisbon check-in incident"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
